{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-box">

        <h1>Medical Store</h1>
        <p>Admin Login</p>

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="demo-login">
            <strong>Demo Login</strong><br>
            Username: admin<br>
            Password: admin123
        </div>

    </div>

</div>

{% endblock %}
